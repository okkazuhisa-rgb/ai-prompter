<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- PDF.js for on-device PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>stealth brain - Hands-free Real-time AI Prompter</title>
    <!-- Google Fonts: Outfit (Premium & Modern Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(25, 25, 25, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #888888;
            --text-dark: #444444;
            --color-white: #ffffff;
            --color-yellow: #ffcc00;
            --color-red: #ff3b30;
            --glow-white: rgba(255, 255, 255, 0.35);
            --glow-yellow: rgba(255, 204, 0, 0.45);
            --glow-red: rgba(255, 59, 48, 0.55);
            --font-size-base: 6.5vw;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* App Header */
        .app-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            z-index: 100;
            position: absolute;
            top: 0;
            left: 0;
        }
        #app-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        #app-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* Edge Glow Overlays */
        .edge-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            transition: box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.0);
        }
        .edge-glow.glow-white {
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.22);
        }
        .edge-glow.glow-yellow {
            box-shadow: inset 0 0 40px rgba(255, 204, 0, 0.3);
        }
        .edge-glow.glow-red {
            box-shadow: inset 0 0 40px rgba(255, 59, 48, 0.35);
        }

        /* Segmented control for Persona Tabs */
        .persona-tabs {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 4px;
            gap: 2px;
            margin: 8px auto 4px;
            max-width: 90%;
            width: fit-content;
            align-self: center;
            z-index: 10;
        }
        .persona-tab {
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .persona-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Agenda Progress line */
        .agenda-progress-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 4px auto 8px;
            max-width: 90%;
            width: fit-content;
            align-self: center;
            z-index: 10;
        }
        .agenda-step {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }
        .agenda-dot {
            font-size: 11px;
            line-height: 1;
        }
        .agenda-text {
            font-size: 10px;
            letter-spacing: -0.01em;
        }
        .agenda-connector {
            color: rgba(255, 255, 255, 0.15);
            font-size: 9px;
            letter-spacing: -1.5px;
            padding: 0 2px;
            user-select: none;
        }
        .agenda-step.active-white {
            color: var(--color-white) !important;
            font-weight: 800;
            text-shadow: 0 0 10px var(--glow-white);
        }
        .agenda-step.active-yellow {
            color: var(--color-yellow) !important;
            font-weight: 800;
            text-shadow: 0 0 12px var(--glow-yellow);
        }
        .agenda-step.active-red {
            color: var(--color-red) !important;
            font-weight: 800;
            text-shadow: 0 0 12px var(--glow-red);
        }

        /* Prompter Area */
        .prompter-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: left;
            position: relative;
            width: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #prompter-text {
            font-size: var(--font-size-base);
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: -0.018em;
            word-break: break-all;
            white-space: pre-wrap;
            transition: color 0.4s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            width: 100%;
            max-width: 100%;
            text-align: left;
            opacity: 1;
            transform: translateY(0);
        }
        #prompter-text.transitioning {
            opacity: 0;
            transform: translateY(12px);
        }
        #prompter-text.initial-placeholder {
            font-size: calc(var(--font-size-base) * 0.7) !important;
            font-weight: 500 !important;
            opacity: 0.65 !important;
            text-shadow: none !important;
            color: var(--text-dim) !important;
            text-align: center !important;
        }

        .style-white {
            color: var(--color-white) !important;
            text-shadow: 0 0 20px var(--glow-white);
        }
        .style-yellow {
            color: var(--color-yellow) !important;
            text-shadow: 0 0 25px var(--glow-yellow);
        }
        .style-red {
            color: var(--color-red) !important;
            text-shadow: 0 0 25px var(--glow-red);
        }

        /* Copilot Mode Specific UI */
        .copilot-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: flex-start;
            gap: 16px;
        }
        .copilot-recommend {
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: -0.018em;
            word-break: break-all;
            white-space: pre-wrap;
            color: var(--color-white) !important;
            text-shadow: 0 0 20px var(--glow-white);
        }
        .copilot-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
        }
        .copilot-tag-badge {
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.3);
            color: var(--color-yellow);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            text-shadow: 0 0 8px var(--glow-yellow);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .copilot-state-container {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            font-family: monospace;
            font-size: 11.5px;
            line-height: 1.5;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Main Screen Suggestion History Container */
        .main-history-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            margin: 0 24px 10px;
            padding: 10px 14px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 150px; /* Collapsed: show ~3 suggestions */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 15;
        }
        .main-history-container.focused {
            max-height: 380px; /* Expanded focused height */
            background: rgba(12, 12, 12, 0.95);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 10px rgba(255, 255, 255, 0.05);
        }
        .main-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dim);
        }
        .main-history-title {
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .main-history-clear-btn {
            color: var(--color-red);
            font-weight: 700;
            cursor: pointer;
            display: none;
        }
        .main-history-container.focused .main-history-clear-btn {
            display: inline-block;
        }
        .main-history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
            flex: 1;
        }
        .main-history-container.focused .main-history-list {
            overflow-y: auto;
        }
        .main-history-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 6px 4px;
            cursor: pointer;
        }
        .main-history-item:last-child {
            border-bottom: none;
        }
        .main-history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 2px;
        }
        .main-history-text {
            font-size: 11.5px;
            color: #dddddd;
            line-height: 1.35;
            white-space: pre-wrap;
            word-break: break-all;
            text-align: left;
        }
        .history-empty {
            text-align: center;
            padding: 10px;
            color: var(--text-dark);
            font-style: italic;
            font-size: 12px;
        }

        /* Speech Recognition Transcript Preview */
        .live-preview-container {
            padding: 12px 24px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
        }
        #live-transcript {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
            min-height: 90px;
            opacity: 0.85;
            transition: color 0.2s;
            line-height: 1.4;
            text-align: left;
        }
        #live-transcript.active {
            color: #30d158;
        }

        /* Controller Bar (Floating dock design) */
        .controller-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 20, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 24px;
            gap: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
        }
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2.2px;
            background: rgba(255, 255, 255, 0.05);
        }
        #silence-progress {
            width: 0%;
            height: 100%;
            background: #0a84ff;
            transition: width 0.1s linear;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-dark);
            transition: all 0.3s ease;
        }
        .status-dot.active {
            background-color: #30d158;
            box-shadow: 0 0 10px rgba(48, 209, 88, 0.6);
        }
        .status-dot.thinking {
            background-color: #0a84ff;
            box-shadow: 0 0 10px rgba(10, 132, 255, 0.6);
            animation: pulse 1.2s infinite alternate;
        }
        .status-dot.error {
            background-color: var(--color-red);
            box-shadow: 0 0 10px var(--glow-red);
        }
        #status-text {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }
        .btn-toggle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-toggle:active {
            transform: scale(0.95);
        }
        .btn-toggle.recording {
            background: #ff3b30;
            border-color: #ff453a;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.35);
        }
        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }
        .btn-icon:active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        /* Settings Drawer Slider styling */
        .settings-drawer {
            position: fixed;
            left: 0;
            bottom: -100%;
            width: 100%;
            height: 85vh;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            padding: 24px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .settings-drawer.open {
            bottom: 0;
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 12px;
        }
        .drawer-header h3 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }
        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }
        .btn-close:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group select,
        .form-group textarea {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(255, 255, 255, 0.25);
        }
        .form-group select option {
            background-color: #121212;
            color: #ffffff;
        }
        .api-key-input-container {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .btn-small {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-small:active {
            background: rgba(255, 255, 255, 0.2);
        }
        .font-size-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .font-size-val {
            font-size: 14px;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }

        /* On-device file upload card style */
        .file-upload-card {
            border: 1px dashed rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 4px;
            width: 100%;
        }
        .file-upload-card:active {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
        }
        .file-upload-card svg {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2px;
        }
        .file-upload-card span {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }
        .file-upload-card #file-upload-status {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
            margin-top: 2px;
            display: block;
        }

        .settings-footer {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .settings-footer button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            height: 48px;
        }
        .btn-primary {
            background: #ffffff;
            color: #000000;
        }
        .btn-primary:active {
            background: #dddddd;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Warning banner */
        #api-warning {
            background-color: #ffcc00;
            color: #000000;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            z-index: 90;
        }

        /* Animations */
        @keyframes pulse {
            0% {
                opacity: 0.4;
            }
            100% {
                opacity: 1;
                box-shadow: 0 0 15px rgba(10, 132, 255, 0.8);
            }
        }

        @media (orientation: landscape) {
            :root {
                --font-size-base: 5.5vh;
            }
        }
    </style>
</head>
<body>

    <!-- Edge Glow Inset Screen Shadow -->
    <div id="edge-glow" class="edge-glow"></div>

    <!-- Global JS Error Banner for mobile debugging -->
    <div id="js-error-banner" style="display: none; background: #ff3b30; color: white; padding: 15px; font-size: 13px; font-weight: 700; text-align: left; z-index: 9999; position: fixed; top: 0; left: 0; width: 100%; box-sizing: border-box; word-break: break-all; overflow-y: auto; max-height: 50vh;">
        <span>【JSエラー検知】</span>
        <div id="js-error-msg" style="margin-top: 5px; font-family: monospace; white-space: pre-wrap;"></div>
        <button onclick="document.getElementById('js-error-banner').style.display='none'" style="margin-top: 10px; background: white; color: black; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">閉じる</button>
    </div>

    <!-- API Warning banner if key is not configured -->
    <div id="api-warning" onclick="toggleSettings(true)" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Gemini APIキーを設定してください（タップして設定）
    </div>

    <!-- App Brand Header -->
    <div class="app-header">
        <img id="app-logo" src="stealth_brain_icon.png" alt="logo" onerror="this.style.display='none';">
        <span id="app-title">stealth brain</span>
    </div>

    <!-- Capsule Persona Tabs -->
    <div class="persona-tabs" style="margin-top: 68px;">
        <div id="tab-debate" class="persona-tab active" onclick="switchPersona('debate')">戦略</div>
        <div id="tab-brainstorm" class="persona-tab" onclick="switchPersona('brainstorm')">アイデア</div>
        <div id="tab-facilitate" class="persona-tab" onclick="switchPersona('facilitate')">進行</div>
    </div>

    <!-- Agenda Progress Line -->

    <script>
        // --- Safe Storage Utility to bypass SecurityError inside strict WebViews / private browsing ---
        const safeStorage = {
            _data: {},
            getItem(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn("localStorage.getItem failed for key '" + key + "':", e);
                    return this._data[key] || null;
                }
            },
            setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn("localStorage.setItem failed for key '" + key + "':", e);
                    this._data[key] = String(value);
                }
            },
            removeItem(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    console.warn("localStorage.removeItem failed for key '" + key + "':", e);
                    delete this._data[key];
                }
            }
        };

        // --- State Management ---
        let recognition = null;
        let isListening = false;
        let isResettingSession = false; // 会議発話コミット時の音声認識リセット処理中フラグ
        let accumulatedPastText = ""; // 過去のセッションで確定したテキストの蓄積
        let currentSessionFinalText = ""; // 現在のセッションで確定したテキスト
        let currentInterimText = ""; // 現在のセッションの未確定テキスト（一時保存）
        let conversationHistory = [];
        let aiSuggestionsHistory = [];
        let wakeLock = null;
        
        // Silence Countdown States
        let lastSpeechTime = null;
        let silenceCheckInterval = null;
        let countdownActive = false;
        const SILENCE_DURATION_MS = 3000; // 3 seconds

        // Config items
        let apiKey = "";
        let fontSizeBase = 6.5; // vw unit
        let systemPrompt = "";
        let historyLimit = 10;
        let modelName = "gemini-2.5-flash-lite";
        let silenceDuration = 2.0; // 秒（デフォルト2.0秒）
        let outputLimit = 200; // 出力文字数制限（デフォルト200文字）

        // Advanced Config & States
        let activePersona = "debate";
        let contextDoc = ""; // 会議前提資料のテキスト
        let agendaPresets = "前提, 課題, 施策, 実現性, まとめ";
        let currentPhase = 1;
        let lastStateUpdateText = ""; // Copilot Mode State cache

        const PERSONA_CONFIGS = {
            debate: {
                name: "戦略",
                temperature: 0.5,
                prompt: `あなたはユーザーの思考と発言を強化する超優秀な「戦略（ディベート・ブレイン）」です。会話ログを分析し、ユーザーが議論を有利に進めるため、または深い洞察を与えるための「次に発言すべき具体的な論点・切り口・主張・鋭い質問」を【指定された出力文字数制限に従い、適度に改行を入れて読みやすく】作成してください。

【入力テキストの誤認識に対する超訳ルール】
入力される会話ログは、Web会議の音声を機械的に文字起こしした「不完全な生データ」です。ノイズや滑舌により、激しい誤字脱字、同音異義語の誤変換（例：「エスオーシー」等の謎のカタカナや、言葉の詰まり）が大量に含まれます。
あなたはこれらを文字通りに受け取らず、前後の文脈、および事前に与えられた【プロジェクトの前提情報】から、本来発言者が言いたかった「真の意図」をサイレントに超訳・推測した上で、戦略分析を行ってください。
（例：「仕様の差分」「工数の共有」など、実務的に意味の通る言葉へ脳内補正すること）

【ルール】
1. 「そうですね」「どう思いますか？」「進めましょう」といった、誰でも言える浅い定型句や単純なファシリテーション、オウム返しは【絶対に禁止】です。
2. ユーザーがその場で口にすることで、議論のレベルが一気に上がるような「具体的な根拠、対立軸の指摘、懸念点、あるいは代替案」を提案してください。
3. 出力フォーマットは、必ずタグに続いて発言内容のみとし、解説や markdown のコードブロック(\`\`\`)は含めないでください。

【タグの選定基準】
- [WHITE] ：鋭い指摘、納得感のある根拠、建設的な提案、本質を突く質問。
- [YELLOW]：議論が本質から脱線している際、本質的なアジェンダに強引に引き戻すための切り口。
- [RED]    ：対立が起きている際、相手の主張の矛盾を突くカウンター、または決定的な妥協案。`,
                tag: "WHITE"
            },
            brainstorm: {
                name: "アイデア",
                temperature: 0.9,
                prompt: `あなたはユーザーの創造性を極限まで高める「ブレインストーミング・パートナー（アイデア・エンジン）」です。会話ログを分析し、凝り固まった議論を壊して新しい視点を開くような「独創的なアイデア、常識を疑う別のアプローチ、予期せぬアナロジー」を【指定された出力文字数制限に従い、適度に改行を入れて読みやすく】作成してください。

【入力テキストの誤認識に対する超訳ルール】
入力される会話ログは、Web会議の音声を機械的に文字起こしした「不完全な生データ」です。ノイズや滑舌により、激しい誤字脱字、同音異義語の誤変換（例：「エスオーシー」等の謎のカタカナや、言葉の詰まり）が大量に含まれます。
あなたはこれらを文字通りに受け取らず、前後の文脈、および事前に与えられた【プロジェクトの前提情報】から、本来発言者が言いたかった「真の意図」をサイレントに超訳・推測した上で、アイデア提案を行ってください。
（例：「仕様の差分」「工数の共有」など、実務的に意味の通る言葉へ脳内補正すること）

【ルール】
1. 当たり前の意見やオウム返しは【絶対に禁止】です。
2. ユーザーの発想を大きく広げるための「斬新な切り口、他業界のモデルの応用、またはユニークな疑問」を提案してください。
3. 出力フォーマットは、必ずタグに続いて発言内容のみとし、解説や markdown のコードブロック(\`\`\`)は含めないでください。

【タグの選定基準】
- [WHITE] ：ユニークな着想、発展性のあるアイデア、面白い仮説。
- [YELLOW]：前提条件を疑うクリティカルな質問、別角度からのアナロジー。
- [RED]    ：トレードオフを打破するウルトラC的な解決策、破壊的な代替プラン。`,
                tag: "WHITE"
            },
            facilitate: {
                name: "進行",
                temperature: 0.3,
                prompt: `あなたはファシリテーターを支援する「カンペ（副操縦士）」です。前ターンの要約（State）と直近3発言から、以下を出力してください。解説やマークダウンは一切出力禁止です。

【RECOMMEND】
（人間が口頭で言うべき推奨セリフ。100〜150字程度。具体的な問いかけで終える。前置きは不要。アラインやブラッシュアップ等の用語は、多用を避け、使う場合は具体的な内容や文脈を併記して分かりやすくすること）

【NEXT】
（議論が手詰まった際の別角度の切り口タグを3つスペース区切りで出力。例：\`[管理者側の巻き込み] [通知の工夫] [インセンティブ]\`。箇条書き不可）

【STATE_UPDATE】
■ 現在の位置：[フェーズ名と残り時間の目安] [PHASE:番号]
■ これまでの合意点：
・（箇条書き1〜2点）
■ 未決の論点・課題：
・（箇書き1点）
※アジェンダ連動のため「現在の位置」の行末に必ず \`[PHASE:番号]\`（1〜5）を付記すること。

【ルール】
1. 終了シグナル（「ありがとう」「お疲れ様」等）検知時は、強制的にまとめフェーズ（[PHASE:5]）へ遷移し、クローズ挨拶を【RECOMMEND】に出力。新たな問いかけは禁止。
2. 直近3ターンの出力と文字列20%以上一致する表現や、意味的に酷似した提案は禁止。
3. 不完全な音声認識テキストは、前後の文脈や前提情報から本来の意図を汲み取ってサイレントに解釈すること。`,
                tag: "WHITE"

        // --- Helper to get system prompt with auto-migration of old hardcoded character limits ---
        function getSystemPromptForPersona(persona) {
            let loadedPrompt = safeStorage.getItem(`ai_prompter_system_prompt_${persona}`);
            if (loadedPrompt) {
                loadedPrompt = loadedPrompt.replace(/全体で150[〜~]200文字程度/g, "指定された出力文字数制限に従い");
                return loadedPrompt;
            }
            return (PERSONA_CONFIGS[persona] ? PERSONA_CONFIGS[persona].prompt : "");
        }

        // --- Global error handler helper ---
        window.addEventListener('error', (event) => {
            const banner = document.getElementById('js-error-banner');
            const msgEl = document.getElementById('js-error-msg');
            if (banner && msgEl) {
                banner.style.display = 'block';
                msgEl.textContent = `${event.message}\nat ${event.filename}:${event.lineno}:${event.colno}\n\nStack: ${event.error ? event.error.stack : 'N/A'}`;
            }
        });

        // --- Document initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                loadSettings();
            } catch (err) {
                console.error("Error loading settings:", err);
            }

            // Bind clear file delete button
            const fileDeleteBtn = document.getElementById('btn-clear-file');
            if (fileDeleteBtn) {
                fileDeleteBtn.addEventListener('click', clearFileAttachment);
            }

            // Setup document click listener to close suggestion history drawer when clicked outside
            document.addEventListener('click', (e) => {
                const container = document.getElementById('main-ai-history');
                if (container && container.classList.contains('focused')) {
                    if (!container.contains(e.target)) {
                        container.classList.remove('focused');
                    }
                }
            });

            try {
                initSpeechRecognition();
            } catch (err) {
                console.error("Error initializing speech recognition:", err);
            }

            try {
                setupSwipeGestures();
            } catch (err) {
                console.error("Error setting up swipe gestures:", err);
            }

            try {
                checkApiKeyStatus();
            } catch (err) {
                console.error("Error checking API key status:", err);
            }

            document.addEventListener('visibilitychange', handleVisibilityChange);
        });

        // --- Settings Management (localStorage via safeStorage) ---
        function loadSettings() {
            apiKey = safeStorage.getItem('ai_prompter_api_key') || "";
            fontSizeBase = parseFloat(safeStorage.getItem('ai_prompter_font_size')) || 6.5;
            historyLimit = parseInt(safeStorage.getItem('ai_prompter_history_limit')) || 10;
            modelName = safeStorage.getItem('ai_prompter_model_name') || "gemini-2.5-flash-lite";
            silenceDuration = parseFloat(safeStorage.getItem('ai_prompter_silence_duration')) || 2.0;
            agendaPresets = safeStorage.getItem('ai_prompter_agenda_presets') || "前提, 課題, 施策, 実現性, まとめ";
            outputLimit = parseInt(safeStorage.getItem('ai_prompter_output_limit')) || 200;
            lastStateUpdateText = safeStorage.getItem('ai_prompter_last_state_update') || "";
            
            let savedPersona = safeStorage.getItem('ai_prompter_active_persona');
            if (!savedPersona || !PERSONA_CONFIGS[savedPersona]) {
                savedPersona = "debate";
            }
            activePersona = savedPersona;
            
            systemPrompt = safeStorage.getItem(`ai_prompter_system_prompt_${activePersona}`) || (PERSONA_CONFIGS[activePersona] ? PERSONA_CONFIGS[activePersona].prompt : "");
            contextDoc = safeStorage.getItem('ai_prompter_context_doc') || "";
            
            const localHist = safeStorage.getItem('ai_prompter_history');
            if (localHist) {
                try {
                    const parsed = JSON.parse(localHist);
                    if (Array.isArray(parsed)) {
                        conversationHistory = parsed;
                    } else {
                        conversationHistory = [];
                    }
                } catch(e) {
                    conversationHistory = [];
                }
            } else {
                conversationHistory = [];
            }

            const savedAiHist = safeStorage.getItem('ai_prompter_ai_history');
            if (savedAiHist) {
                try {
                    const parsed = JSON.parse(savedAiHist);
                    if (Array.isArray(parsed)) {
                        aiSuggestionsHistory = parsed;
                    } else {
                        aiSuggestionsHistory = [];
                    }
                } catch(e) {
                    aiSuggestionsHistory = [];
                }
            } else {
                aiSuggestionsHistory = [];
            }

            // Sync with elements
            document.getElementById('setting-api-key').value = apiKey;
            document.getElementById('setting-model-name').value = modelName;
            document.getElementById('setting-history-limit').value = historyLimit;
            document.getElementById('setting-system-prompt').value = systemPrompt;

        // --- File Attachment Handler (On-device text extraction) ---
        async function handleFileAttachment(input) {
            const file = input.files[0];
            if (!file) return;

            const statusEl = document.getElementById('file-upload-status');
            const textareaEl = document.getElementById('setting-context-doc');
            if (statusEl) {
                statusEl.textContent = "ファイルを解析中...";
                statusEl.style.color = "#ffcc00";
            }

            const extension = file.name.split('.').pop().toLowerCase();

            try {
                if (extension === 'pdf') {
                    if (typeof pdfjsLib === 'undefined') {
                        throw new Error("PDF解析ライブラリが読み込まれていません。インターネット接続を確認してください。");
                    }

                    const arrayBuffer = await readFileAsArrayBuffer(file);
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
                    
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = "";
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n';
                    }
                    
                    if (textareaEl) {
                        textareaEl.value = (textareaEl.value.trim() ? textareaEl.value + '\n\n' : '') + `=== 添付資料 [PDF]: ${file.name} ===\n` + fullText.trim();
                        textareaEl.dispatchEvent(new Event('input'));
                    }
                    
                    if (statusEl) {
                        statusEl.textContent = `PDF解析に成功しました: ${file.name} (${pdf.numPages}ページ)`;
                        statusEl.style.color = "#30d158";
                    }
                } else if (['txt', 'md', 'csv', 'json', 'html'].includes(extension)) {
                    const text = await readFileAsText(file);
                    if (textareaEl) {
                        textareaEl.value = (textareaEl.value.trim() ? textareaEl.value + '\n\n' : '') + `=== 添付資料: ${file.name} ===\n` + text.trim();
                        textareaEl.dispatchEvent(new Event('input'));
                    }
                    if (statusEl) {
                        statusEl.textContent = `添付ファイルを読み込みました: ${file.name}`;
                        statusEl.style.color = "#30d158";
                    }
                } else {
                    throw new Error("サポートされていないファイル形式です。TXT, MD, CSV, PDF, JSONファイルを添付してください。");
                }
                
                contextDoc = textareaEl.value;
                safeStorage.setItem('ai_prompter_context_doc', contextDoc);
                updateFileDeleteButtonState();
            } catch (err) {
                console.error("File loading error:", err);
                if (statusEl) {
                    statusEl.textContent = `エラー: ${err.message}`;
                    statusEl.style.color = "#ff3b30";
                }
            } finally {
                input.value = "";
            }
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error("ファイルの読み込みに失敗しました。"));
                reader.readAsText(file);
            });
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error("ファイルの読み込みに失敗しました。"));
                reader.readAsArrayBuffer(file);
            });
        }

        // --- Web Speech API (Speech Recognition) ---
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                updateStatus("NOT SUPPORTED", "error");
                document.getElementById('live-transcript').textContent = "エラー: Web Speech APIに対応していません。";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ja-JP';

            recognition.onstart = () => {
                console.log("Speech recognition started");
                updateStatus("LISTENING", "active");
                ensureCountdownLoopRunning();
                requestWakeLock();
            };

            recognition.onresult = (event) => {
                if (isResettingSession) {
                    console.log("Recognition results ignored during session reset.");
                    return;
                }
                
                lastSpeechTime = Date.now();
                
                let interim = "";
                let final = "";
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const result = event.results[i];
                    if (result.isFinal) {
                        final += result[0].transcript;
                    } else {
                        interim += result[0].transcript;
                    }
                }
                
                currentInterimText = interim;
                if (final) {
                    currentSessionFinalText += final;
                }

                // Normalizing duplicate Chrome Android results
                let displayTranscript = currentSessionFinalText + currentInterimText;
                
                const transcriptEl = document.getElementById('live-transcript');
                if (transcriptEl) {
                    transcriptEl.classList.add('active');
                    transcriptEl.textContent = displayTranscript || "マイク：音声を認識中...";
                }

                // Buffer trimming helper (limit to 1000 characters)
                if (currentSessionFinalText.length > 1000) {
                    currentSessionFinalText = currentSessionFinalText.slice(-500);
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech recognition error:", event.error);
                if (event.error === 'not-allowed') {
                    updateStatus("MIC NOT ALLOWED", "error");
                    document.getElementById('live-transcript').textContent = "エラー: マイクの使用が許可されていません。ブラウザ設定を確認してください。";
                } else if (event.error !== 'aborted') {
                    updateStatus("REC ERROR", "error");
                }
            };

            recognition.onend = () => {
                console.log("Speech recognition ended");
                // Automatically restart if it was active
                if (isListening && !isResettingSession) {
                    console.log("Restarting speech recognition...");
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Speech recognition restart failed:", e);
                    }
                } else if (!isListening) {
                    updateStatus("STOPPED", "stopped");
                    document.getElementById('live-transcript').classList.remove('active');
                    releaseWakeLock();
                }
            };
        }

        function toggleListening() {

            } else {

            }
        }

        function startListening() {
            if (!recognition) return;
            isListening = true;
            currentSessionFinalText = "";
            currentInterimText = "";

        function stopListening() {

        // Commit voice transcript and reset buffers
        async function commitTranscriptSegment() {
            const finalSpeechText = (currentSessionFinalText + currentInterimText).trim();
            if (!finalSpeechText) {
                console.log("Transcript segment is empty. Committing skipped.");
                return;
            }
            
            console.log("Committing speech segment:", finalSpeechText);
            
            // Push to context list
            conversationHistory.push(finalSpeechText);
            if (conversationHistory.length > historyLimit) {
                conversationHistory.shift();
            }
            safeStorage.setItem('ai_prompter_history', JSON.stringify(conversationHistory));
            renderHistoryUI();

            // Set reset flag
            isResettingSession = true;
            
            // UI Visual status
            const transcriptEl = document.getElementById('live-transcript');
            if (transcriptEl) {
                transcriptEl.textContent = "AI分析中... マイクバッファ再起動しています";
                transcriptEl.classList.remove('active');
            }

            // Web Speech API buffer reset logic (forcing restart)
            try {
                if (recognition) {
                    recognition.stop();
                }
            } catch(e) {
                console.error("Error stopping recognition on commit:", e);
            }

            // Reset local buffers
            currentSessionFinalText = "";
            currentInterimText = "";
            lastSpeechTime = Date.now();

            // Reset completed, start recognition again safely (WITHOUT waiting for Gemini)
            isResettingSession = false;
            if (isListening && recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    console.error("Error restarting recognition after commit:", e);
                }
            }

            // Fire Gemini suggestion request asynchronously in background
            sendToGemini();
        }

        // --- Silence Check countdown loop ---
        function ensureCountdownLoopRunning() {
            stopCountdownLoop();
            countdownActive = true;
            silenceCheckInterval = setInterval(checkSilenceAndTick, 100);
        }

        function stopCountdownLoop() {
            if (silenceCheckInterval) {
                clearInterval(silenceCheckInterval);
                silenceCheckInterval = null;
            }
            countdownActive = false;
            document.getElementById('silence-progress').style.width = "0%";
        }

        function checkSilenceAndTick() {
            if (!isListening || isResettingSession) return;
            
            const timeSinceLastSpeech = Date.now() - lastSpeechTime;
            const thresholdMs = silenceDuration * 1000;
            
            // Fill countdown progress bar
            let ratio = timeSinceLastSpeech / thresholdMs;
            if (ratio > 1.0) ratio = 1.0;
            if (ratio < 0) ratio = 0;
            
            const bar = document.getElementById('silence-progress');
            if (bar) {
                bar.style.width = `${ratio * 100}%`;
                
                // Color transition from blue -> yellow -> red
                if (ratio > 0.8) {
                    bar.style.backgroundColor = "var(--color-red)";
                } else if (ratio > 0.4) {
                    bar.style.backgroundColor = "var(--color-yellow)";
                } else {
                    bar.style.backgroundColor = "#0a84ff";
                }
            }
            
            if (timeSinceLastSpeech >= thresholdMs) {
                console.log(`Silence detected (${silenceDuration}s). Committing text segment.`);
                lastSpeechTime = Date.now(); // throttle repeated triggers
                commitTranscriptSegment();
            }
        }

        function handlePrompterTap() {
            if (isListening) {
                console.log("Prompter screen tapped. Manual submission triggered.");
                lastSpeechTime = Date.now();
                commitTranscriptSegment();
            }
        }

        // --- API Integration (Gemini direct JSON request) ---
        async function sendToGemini() {
            if (!apiKey) {
                console.warn("API Key is missing. Cannot fetch Gemini suggestion.");
                updateStatus("API KEY MISSING", "error");
                return;
            }

            if (conversationHistory.length === 0) {
                console.log("History is empty. Skipping API request.");
                return;
            }

            updateStatus("THINKING", "thinking");
            
            // Fetch temperature per active persona
            const personaTemp = (PERSONA_CONFIGS[activePersona] && PERSONA_CONFIGS[activePersona].temperature !== undefined) ? PERSONA_CONFIGS[activePersona].temperature : 0.75;

            // Build text context for the prompt
            let contextPrompt = "";
            if (contextDoc && contextDoc.trim()) {
                contextPrompt = `\n\n【前提資料・アジェンダ】\n${contextDoc.trim()}\n------------------------------`;
            }

            let dynamicAgendaRule = "";
            if (agendaPresets && agendaPresets.trim()) {
                dynamicAgendaRule = `\n\n【アジェンダ進行指示】
現在の会話内容から、全体のアジェンダ [${agendaPresets.trim()}] のうち、現在どのフェーズに位置しているかを裏で判定してください。
そして、出力する提言テキストの【末尾】に、必ず \`[PHASE:インデックス番号]\`（例: 1から始まるアジェンダ項目の番号。1番目の項目の場合は \`[PHASE:1]\`）というタグのみを付与して返却してください。
（例：発言提案のテキスト [PHASE:2]）`;
            }

            let characterLimitRule = "";
            if (activePersona !== 'facilitate') {
                characterLimitRule = `\n\n【出力文字数制限】
提案する発言候補テキストは、全体で必ず「${outputLimit}文字以内」とし、適度に改行を入れて読みやすく作成してください。この文字数上限は厳格に遵守してください。`;
            } else {
                characterLimitRule = `\n\n【出力文字数制限】
【RECOMMEND】のセリフは100文字〜150文字程度とし、全体の出力は簡潔にまとめてください。`;
            }

            let recentSuggestionsRule = "";
            if (aiSuggestionsHistory && aiSuggestionsHistory.length > 0) {
                const recents = aiSuggestionsHistory.slice(0, 3).map((item, idx) => `直近の提案 #${idx + 1} [${item.persona}]: ${item.text}`).join('\n');
                recentSuggestionsRule = `\n\n【直近の提案履歴】\n${recents}\n\n【重複の絶対禁止ルール】\n過去3ターン以内の出力（上記【直近の提案履歴】）と「文字列として20%以上一致する出力」および「意味的に酷似した提案」は厳格に禁止します。常に最新の直近3発言を反映した、新規の切り口の発言候補を生成してください。`;
            }

            // ビジネス用語クリシェ排除フィルター
            let clicheRule = `\n\n【表現の禁止・推奨ルール】
以下の曖昧で中身のないビジネス用語（コーポレート・クリシェ）の使用は【厳格に禁止】します。
・禁止語:「シナジー」「アライン」「ブラッシュアップ」「最適化を図る」「最大化」「推進」「ベクトルを合わせる」
代わりに、より具体的でリアルな実務語彙、または対立軸を突く具体的な指摘を用い、簡潔に提案してください。`;

            // 会議アジェンダ進行フェーズ連動ルールおよび終了判定
            let steps = agendaPresets.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (steps.length === 0) {
                steps = ["前提", "課題", "施策", "実現性", "まとめ"];
            }

            // 終了シグナルの検知（直近3発言）
            const terminationSignals = ["ありがとうございました", "お疲れ様でした", "お疲れさまでした", "退出", "終わります", "タイムオーバー", "タイムアップ", "おわります"];
            const recentUtterancesForTerm = conversationHistory.slice(-3);
            let terminationDetected = false;
            for (const utterance of recentUtterancesForTerm) {
                for (const signal of terminationSignals) {
                    if (utterance.includes(signal)) {
                        terminationDetected = true;
                        break;
                    }
                }
                if (terminationDetected) break;
            }

            let agendaPhaseRule = "";
            if (activePersona === 'facilitate' && terminationDetected) {
                const lastPhaseNum = steps.length;
                agendaPhaseRule = `\n\n【緊急割込指示：終了シグナル検知】
直近の発言において終了のシグナル（「ありがとうございました」「お疲れ様でした」など）が検知されました。既存の議論フェーズをすべて破棄し、強制的に【まとめ・終了フェーズ】へ遷移してください。
新たな議論の深掘り（問いかけ）は一切【禁止】とし、メンバーの労をねぎらい、セッションをクローズするための挨拶セリフを【RECOMMEND】に出力してください。また、現在の位置を「まとめ（[PHASE:${lastPhaseNum}]）」として出力してください。`;
            } else {
                let isEarlyPhase = (currentPhase <= 2 || currentPhase <= Math.ceil(steps.length / 2));
                if (isEarlyPhase) {
                    agendaPhaseRule = `\n\n【アジェンダフェーズ連動ルール】
現在は会議の前半フェーズ（現在のステップ: [${steps[currentPhase - 1] || '前提・課題'} ]）です。
アイデア発想や論点整理のために、「そもそも〜という前提や意図は何ですか？」「見落としている根本的な課題は何か」といった、前提や課題の核心に迫る「本質的な問いかけ」や「対立軸の指摘」を優先してください。`;
                } else {
                    agendaPhaseRule = `\n\n【アジェンダフェーズ連動ルール】
現在は会議の後半フェーズ（現在のステップ: [${steps[currentPhase - 1] || '施策・実現性'} ]）です。
具体的な実行可能性や合意形成のために、リソース、スケジュール、役割分担などの「実行上のボトルネックを指摘する現実的な論点」や「対立点を統合する折衷案・次のステップの提言」を優先してください。`;
                }
            }

            // Native systemInstruction payload construction
            const systemRule = `【システム指示】
${systemPrompt}${contextPrompt}${dynamicAgendaRule}${characterLimitRule}${recentSuggestionsRule}${clicheRule}${agendaPhaseRule}`;
            
            // Build dynamic User Prompt based on persona input structure rules
            let userPromptText = "";
            if (activePersona === 'facilitate') {
                const stateText = lastStateUpdateText ? lastStateUpdateText : "（初期状態：議論はまだ開始されていません）";
                const recentUtterances = conversationHistory.slice(-3);
                const recentText = recentUtterances.length > 0 
                    ? recentUtterances.map((text, idx) => `発言: ${text}`).join('\n')
                    : "（発言はまだありません）";
                
                userPromptText = `【入力1：State（前ターンまでの議論の要約）】\n${stateText}\n\n【入力2：直近3発言の生データ（文字起こしノイズを含む）】\n${recentText}`;
            } else {
                const logContent = conversationHistory.map((text, idx) => `発言 #${idx + 1}: ${text}`).join('\n');
                userPromptText = `${logContent}\n\n上記に基づき、次に私が話すべき内容を提案してください。前置きや説明は一切不要です。タグと発言内容のみを出力してください。`;
            }

            const debugPanel = document.getElementById('debug-info-panel');

            // Payload with native systemInstruction
            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: userPromptText }]
                    }
                ],
                systemInstruction: {
                    parts: [{ text: systemRule }]
                },
                generationConfig: {
                    temperature: personaTemp,
                    maxOutputTokens: 1000
                },
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            // thinkingBudget setting for gemini-2.5 models
            if (modelName && typeof modelName === 'string' && modelName.startsWith("gemini-2.5")) {
                payload.generationConfig.thinkingConfig = {
                    thinkingBudget: 0
                };
            }

            let response = null;
            let errors = {};
            const apiVersions = ['v1beta', 'v1'];

            for (const version of apiVersions) {
                const currentUrl = `https://generativelanguage.googleapis.com/${version}/models/${modelName}:generateContent?key=${apiKey}`;
                try {
                    response = await fetch(currentUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) {
                        break; 
                    } else {
                        const errText = await response.text();
                        let parsedErr = null;
                        try { parsedErr = JSON.parse(errText); } catch(e) {}
                        const msg = (parsedErr && parsedErr.error && parsedErr.error.message) ? parsedErr.error.message : (errText || `Status ${response.status}`);
                        errors[version] = msg;
                        console.warn(`Gemini API version ${version} failed:`, msg);
                    }
                } catch (e) {
                    errors[version] = e.message;
                    console.warn(`Fetch error for version ${version}:`, e);
                }
            }

            try {
                if (!response || !response.ok) {
                    const primaryError = errors['v1beta'] || errors['v1'] || "API Request failed";
                    throw new Error(primaryError);
                }

                const data = await response.json();
                
                if (debugPanel) {
                    const prettyResponse = JSON.stringify(data, null, 2);
                    debugPanel.textContent = `=== [SENT PROMPT] ===\n[SYSTEM INSTRUCTION]\n${systemRule}\n\n[USER PROMPT]\n${userPromptText}\n\n=== [RECEIVED JSON RESPONSE] ===\n${prettyResponse}`;
                }

                const aiResponseText = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) ? data.candidates[0].content.parts[0].text : null;
                
                if (aiResponseText) {
                    parseAndDisplayOutput(aiResponseText);
                } else {
                    const candidate = (data && data.candidates && data.candidates[0]) ? data.candidates[0] : {};
                    const finishReason = candidate.finishReason || "UNKNOWN";
                    throw new Error(`Gemini generated no text content. FinishReason: ${finishReason}`);
                }
                
                if (isListening) {
                    updateStatus("LISTENING", "active");
                } else {
                    updateStatus("STOPPED", "stopped");
                }
            } catch (err) {
                console.error("Gemini Request Failure:", err);
                updateStatus("API ERROR", "error");
                
                if (debugPanel) {
                    debugPanel.textContent = `=== [SENT PROMPT] ===\n[SYSTEM INSTRUCTION]\n${systemRule}\n\n[USER PROMPT]\n${userPromptText}\n\n=== [ERROR] ===\n${err.message}`;
                }
                
                const textEl = document.getElementById('prompter-text');
                if (textEl) {
                    textEl.className = "style-red";
                    
                    let displayMsg = err.message;
                    if (displayMsg.includes("API key not valid")) {
                        displayMsg = "APIキーが無効、または間違っています。Google AI Studioで正しいキーを生成し直してください。";
                    } else if (displayMsg.includes("Generative Language API has not been used") || displayMsg.includes("is disabled")) {
                        displayMsg = "APIが有効化されていません。Google Cloud Consoleで「Generative Language API」を有効化してください。";
                    }
                    textEl.textContent = `APIエラーが発生しました:\n\n${displayMsg}`;
                }
            }
        }

        // --- Parsing AI response ---
        function parseAndDisplayOutput(rawText) {
            let content = rawText.trim();
            
            // Remove markdown code blocks
            content = content.replace(/^```[a-zA-Z]*\n/, '');
            content = content.replace(/\n```$/, '');

            // 1. Agenda progress parser [PHASE:X]
            const phaseMatch = content.match(/\[PHASE\s*:\s*(\d+)\]/i);
            if (phaseMatch) {
                const matchedPhase = parseInt(phaseMatch[1]);
                const stepsCount = agendaPresets.split(',').map(s => s.trim()).filter(s => s.length > 0).length || 5;
                if (matchedPhase >= 1 && matchedPhase <= stepsCount) {
                    currentPhase = matchedPhase;
                    renderAgendaProgressUI(currentPhase);
                }
                // Strip the tag from text
                content = content.replace(/\[PHASE\s*:\s*\d+\]/gi, '').trim();
            }

            const timestamp = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const personaName = PERSONA_CONFIGS[activePersona] ? PERSONA_CONFIGS[activePersona].name : activePersona;

            // 2. Facilitator (Copilot Mode) specific parsing
            if (activePersona === 'facilitate') {
                const recIndex = content.indexOf("【RECOMMEND】");
                const nextIndex = content.indexOf("【NEXT】");
                const stateIndex = content.indexOf("【STATE_UPDATE】");

                let recommendText = "";
                let nextTagsText = "";
                let stateUpdateText = "";

                if (recIndex !== -1) {
                    let end = content.length;
                    if (nextIndex !== -1 && nextIndex > recIndex) end = nextIndex;
                    else if (stateIndex !== -1 && stateIndex > recIndex) end = stateIndex;
                    recommendText = content.substring(recIndex + "【RECOMMEND】".length, end).trim();
                }

                if (nextIndex !== -1) {
                    let end = content.length;
                    if (stateIndex !== -1 && stateIndex > nextIndex) end = stateIndex;
                    else if (recIndex !== -1 && recIndex > nextIndex) end = recIndex;
                    nextTagsText = content.substring(nextIndex + "【NEXT】".length, end).trim();
                }

                if (stateIndex !== -1) {
                    let end = content.length;
                    if (recIndex !== -1 && recIndex > stateIndex) end = recIndex;
                    else if (nextIndex !== -1 && nextIndex > stateIndex) end = nextIndex;
                    stateUpdateText = content.substring(stateIndex + "【STATE_UPDATE】".length, end).trim();
                }

                // If parsing fails to find tags, treat whole text as recommend
                if (!recommendText && !nextTagsText && !stateUpdateText) {
                    recommendText = content;
                }

                // Save state update context to memory for next turn inputs
                if (stateUpdateText) {
                    lastStateUpdateText = stateUpdateText;
                    safeStorage.setItem('ai_prompter_last_state_update', lastStateUpdateText);
                }

                // AI Suggestion History saving (save recommend text)
                aiSuggestionsHistory.unshift({
                    persona: personaName,
                    tag: "WHITE",
                    text: recommendText,
                    time: timestamp,
                    phase: currentPhase
                });
                if (aiSuggestionsHistory.length > 20) {
                    aiSuggestionsHistory.pop();
                }
                safeStorage.setItem('ai_prompter_ai_history', JSON.stringify(aiSuggestionsHistory));
                renderAiHistoryUI();

                // Display using OLED Copilot components
                updateTextWithScaleCopilot(recommendText, nextTagsText, stateUpdateText);
                
            } else {
                // Strategic or Brainstorm (Normal tag mapping)
                let matchedTag = "WHITE";
                let tagStringFound = null;
                const upperContent = content.toUpperCase();

                if (upperContent.includes("[WHITE]") || upperContent.includes("WHITE:")) {
                    matchedTag = "WHITE";
                    tagStringFound = upperContent.includes("[WHITE]") ? "WHITE" : "WHITE";
                } else if (upperContent.includes("[YELLOW]") || upperContent.includes("YELLOW:")) {
                    matchedTag = "YELLOW";
                    tagStringFound = "YELLOW";
                } else if (upperContent.includes("[RED]") || upperContent.includes("RED:")) {
                    matchedTag = "RED";
                    tagStringFound = "RED";
                }

                if (tagStringFound) {
                    const keywordIndex = upperContent.indexOf(tagStringFound);
                    let startIndex = keywordIndex;
                    if (keywordIndex > 0 && content[keywordIndex - 1] === '[') {
                        startIndex = keywordIndex - 1;
                    }
                    
                    let endIndex = keywordIndex + tagStringFound.length;
                    if (endIndex < content.length && content[endIndex] === ']') {
                        endIndex = endIndex + 1;
                    }
                    
                    content = content.substring(endIndex).trim();
                }

                if (!content) {
                    content = "（提案された発言を取得できませんでした。もう一度発言してみてください）";
                }

                // AI Suggestion History saving
                aiSuggestionsHistory.unshift({
                    persona: personaName,
                    tag: matchedTag,
                    text: content,
                    time: timestamp,
                    phase: currentPhase
                });
                if (aiSuggestionsHistory.length > 20) {
                    aiSuggestionsHistory.pop();
                }
                safeStorage.setItem('ai_prompter_ai_history', JSON.stringify(aiSuggestionsHistory));
                renderAiHistoryUI();

                // Normal scaling & glow display
                updateTextWithScale(content, matchedTag);
                updateAgendaGlow(currentPhase, matchedTag);
            }
        }

        // --- Dynamic scaling, Transitions, Edge Glow for Strategic/Brainstorm ---
        function updateTextWithScale(content, matchedTag) {
            const textEl = document.getElementById('prompter-text');
            const glowEl = document.getElementById('edge-glow');
            if (!textEl || !glowEl) return;

            textEl.classList.add('transitioning');
            
            setTimeout(() => {
                textEl.className = ""; // Reset
                
                let glowClass = "glow-white";
                if (matchedTag === "YELLOW") {
                    textEl.classList.add('style-yellow');
                    glowClass = "glow-yellow";
                } else if (matchedTag === "RED") {
                    textEl.classList.add('style-red');
                    glowClass = "glow-red";
                } else {
                    textEl.classList.add('style-white');
                }

                glowEl.className = `edge-glow ${glowClass}`;

                // Autoscale text size
                let scale = 1.0;
                const length = content.length;
                if (length > 150) {
                    scale = 0.55;
                } else if (length > 100) {
                    scale = 0.65;
                } else if (length > 60) {
                    scale = 0.8;
                } else if (length > 30) {
                    scale = 0.9;
                }
                
                const calculatedSize = fontSizeBase * scale;
                textEl.style.fontSize = `${calculatedSize}vw`;
                textEl.textContent = content;
                
                textEl.classList.remove('transitioning');
            }, 200); 
        }

        // --- Copilot Rich UI Display ---
        function updateTextWithScaleCopilot(recommend, nextTags, stateUpdate) {
            const textEl = document.getElementById('prompter-text');
            const glowEl = document.getElementById('edge-glow');
            if (!textEl || !glowEl) return;

            textEl.classList.add('transitioning');

            setTimeout(() => {
                textEl.className = ""; // Reset
                glowEl.className = 'edge-glow glow-white'; // Facilitator glows white

                // Next Tags Badges parse (support bracket tags e.g. [tag1] [tag2])
                let tagLines = [];
                const regex = /\[([^\]]+)\]/g;
                let match;
                while ((match = regex.exec(nextTags)) !== null) {
                    tagLines.push(match[1].trim());
                }
                if (tagLines.length === 0) {
                    // fallback to splitting by newlines, commas, bullets
                    tagLines = nextTags.split(/[\n,、・]+/)
                        .map(line => line.replace(/^[-・\s*]+/, '').trim())
                        .filter(line => line.length > 0);
                }

                let tagsHtml = "";
                if (tagLines.length > 0) {
                    tagsHtml = `<div class="copilot-tags-container">`;
                    tagLines.forEach(tag => {
                        tagsHtml += `<span class="copilot-tag-badge">${escapeHtml(tag)}</span>`;
                    });
                    tagsHtml += `</div>`;
                }

                let stateHtml = "";
                if (stateUpdate) {
                    stateHtml = `<div class="copilot-state-container">${escapeHtml(stateUpdate)}</div>`;
                }

                // Autoscale for recommend text
                let scale = 1.0;
                const length = recommend.length;
                if (length > 150) {
                    scale = 0.55;
                } else if (length > 100) {
                    scale = 0.65;
                } else if (length > 60) {
                    scale = 0.8;
                } else if (length > 30) {
                    scale = 0.9;
                }
                
                const calculatedSize = fontSizeBase * scale;

                textEl.innerHTML = `
                    <div class="copilot-container">
                        <div class="copilot-recommend" style="font-size: ${calculatedSize}vw;">${escapeHtml(recommend)}</div>
                        ${tagsHtml}
                        ${stateHtml}
                    </div>
                `;

                textEl.classList.remove('transitioning');
                updateAgendaGlow(currentPhase, "WHITE");
            }, 200);
        }

        // --- Swipe Gestures & Swipe Persona Switching ---
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        function setupSwipeGestures() {
            try {
                const container = document.querySelector('.prompter-container');
                if (!container) return;
                
                container.addEventListener('touchstart', (e) => {
                    if (e.changedTouches && e.changedTouches[0]) {
                        touchStartX = e.changedTouches[0].screenX;
                        touchStartY = e.changedTouches[0].screenY;
                    }
                }, { passive: true });
                
                container.addEventListener('touchend', (e) => {
                    if (e.changedTouches && e.changedTouches[0]) {
                        touchEndX = e.changedTouches[0].screenX;
                        touchEndY = e.changedTouches[0].screenY;
                        handleSwipeGesture();
                    }
                }, { passive: true });
            } catch (err) {
                console.error("Failed to setup swipe gestures:", err);
            }
        }

        function handleSwipeGesture() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            
            // horizontal swipe logic
            if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 60) {
                const personas = ['debate', 'brainstorm', 'facilitate'];
                let currentIndex = personas.indexOf(activePersona);
                
                if (deltaX > 0) {
                    // Right swipe -> prev persona
                    currentIndex = (currentIndex - 1 + personas.length) % personas.length;
                } else {
                    // Left swipe -> next persona
                    currentIndex = (currentIndex + 1) % personas.length;
                }
                switchPersona(personas[currentIndex]);
            }
        }

        function switchPersona(persona) {
            if (activePersona === persona) return;
            activePersona = persona;
            safeStorage.setItem('ai_prompter_active_persona', activePersona);
            
            // Update active tab styling
            document.querySelectorAll('.persona-tab').forEach(tab => tab.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${persona}`);
            if (activeTab) activeTab.classList.add('active');
            
            // Sync setting system prompt editor
            systemPrompt = safeStorage.getItem(`ai_prompter_system_prompt_${persona}`) || PERSONA_CONFIGS[persona].prompt;
            document.getElementById('setting-system-prompt').value = systemPrompt;

            const glowEl = document.getElementById('edge-glow');
            if (glowEl) {
                glowEl.className = 'edge-glow';
                setTimeout(() => {
                    const tagColor = PERSONA_CONFIGS[persona].tag.toLowerCase();
                    glowEl.classList.add(`glow-${tagColor}`);
                }, 50);
            }
            
            const textEl = document.getElementById('prompter-text');
            if (textEl) {
                textEl.style.fontSize = `${fontSizeBase}vw`;
                textEl.className = "style-white";
                textEl.innerHTML = `${PERSONA_CONFIGS[persona].name}モードに切り替えました。<br>話しかけるとこのモードで提案を生成します。`;
            }

            console.log(`Persona switched to: ${persona}`);
        }

        function updateUIState() {
            const btn = document.getElementById('btn-start-stop');
            const iconIdle = document.getElementById('icon-idle');
            const iconRecording = document.getElementById('icon-recording');
            
            if (isListening) {
                if (btn) btn.classList.add('recording');
                if (iconIdle) iconIdle.style.display = 'none';
                if (iconRecording) iconRecording.style.display = 'block';
            } else {
                if (btn) btn.classList.remove('recording');
                if (iconIdle) iconIdle.style.display = 'block';
                if (iconRecording) iconRecording.style.display = 'none';
            }
        }

        function updateStatus(text, type) {
            const dot = document.getElementById('status-dot');
            const label = document.getElementById('status-text');
            
            if (label) label.textContent = text;
            if (dot) {
                dot.className = "status-dot"; // reset
                if (type === 'active') {
                    dot.classList.add('active');
                } else if (type === 'thinking') {
                    dot.classList.add('thinking');
                } else if (type === 'error') {
                    dot.classList.add('error');
                }
            }
        }

        // --- Screen Wake Lock API ---
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) {
                console.log("Wake Lock API not supported in this browser.");
                return;
            }
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Wake Lock acquired successfully.");
                
                wakeLock.addEventListener('release', () => {
                    console.log("Wake Lock was released.");
                });
            } catch (err) {
                console.warn("Failed to request Wake Lock:", err.message);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release()
                    .then(() => {
                        wakeLock = null;
                        console.log("Wake Lock cleared.");
                    })
                    .catch(err => {
                        console.error("Error releasing Wake Lock:", err);
                    });
            }
        }

        function handleVisibilityChange() {
            if (document.visibilityState === 'visible' && isListening) {
                requestWakeLock();
            }
        }
    </script>
